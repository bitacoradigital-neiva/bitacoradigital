<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Bitácora Digital">
  <!-- Símbolo de Bitácora Digital: la aguja de una brújula (la bitácora es el soporte de la brújula en los barcos)
       que apunta hacia adelante y arriba; también se lee como un cursor. Cuadrado redondeado de grafito. -->
  <defs>
    <linearGradient id="bd-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3c"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="94" height="94" rx="23" fill="url(#bd-tile)"/>
  <rect x="3.75" y="3.75" width="92.5" height="92.5" rx="22.3" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>
  <g transform="rotate(45 50 50)">
    <path d="M50 13 L61.5 50 L50 50 Z" fill="#ffffff"/>
    <path d="M50 13 L50 50 L38.5 50 Z" fill="#d1d1d6"/>
    <path d="M38.5 50 L50 50 L50 87 Z" fill="#636366"/>
    <path d="M50 50 L61.5 50 L50 87 Z" fill="#3a3a3c"/>
  </g>
</svg>
